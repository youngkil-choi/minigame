<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — 미니 아케이드</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0d0f18;
    --panel: #161a28;
    --cell-line: #313a56;
    --board: #171d2e;
    --empty: #232a3e;
    --accent: #ffcc4d;
    --text: #e9ecf8;
    --muted: #8b93b8;
    --faint: #5b6488;
    --mono: ui-monospace, "Cascadia Code", "Consolas", monospace;
    --sans: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: linear-gradient(160deg, #12141f, #0d0f18);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 16px 40px; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .home-nav {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 0.82rem; color: var(--text); text-decoration: none;
    background: rgba(22,26,40,0.7); border: 1px solid var(--cell-line);
    padding: 9px 15px; border-radius: 10px; backdrop-filter: blur(6px);
    transition: border-color .15s, transform .12s;
  }
  .home-nav:hover { border-color: var(--accent); transform: translateY(-1px); }
  .home-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  h1 { font-family: var(--mono); font-size: 2rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 .accent { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }

  .topbar {
    display: flex; align-items: stretch; gap: 10px;
    width: 100%; max-width: 420px; margin-bottom: 14px;
  }
  .scorebox {
    flex: 1; background: var(--panel); border: 1px solid var(--cell-line);
    border-radius: 12px; padding: 10px 14px; text-align: center;
  }
  .scorebox .lbl { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  .scorebox .val { font-family: var(--mono); font-size: 1.5rem; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .newbtn {
    font-family: var(--mono); font-size: 0.9rem; font-weight: 600;
    background: var(--accent); color: #14131c; border: none;
    border-radius: 12px; padding: 0 20px; cursor: pointer;
    transition: transform .12s, box-shadow .2s;
    box-shadow: 0 6px 20px rgba(255,204,77,0.24);
  }
  .newbtn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,204,77,0.38); }
  .newbtn:active { transform: translateY(0); }

  .board-wrap { position: relative; }
  #board {
    position: relative;
    background: var(--board); border: 1px solid var(--cell-line);
    border-radius: 14px; padding: var(--pad);
    --pad: 12px; --gap: 12px; --size: 96px;
    width: calc(4 * var(--size) + 5 * var(--gap));
    height: calc(4 * var(--size) + 5 * var(--gap));
    max-width: 92vw; touch-action: none;
  }
  .bg-cell {
    position: absolute; width: var(--size); height: var(--size);
    background: var(--empty); border-radius: 8px;
  }
  .tile {
    position: absolute; width: var(--size); height: var(--size);
    border-radius: 8px; display: grid; place-items: center;
    font-family: var(--mono); font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: transform .12s ease, background .12s, color .12s;
    will-change: transform;
  }
  .tile .v { font-size: clamp(1rem, 6vw, 2.1rem); }
  .tile.small .v { font-size: clamp(0.8rem, 4.5vw, 1.5rem); }
  .tile.pop { animation: pop .16s ease; }
  .tile.spawn { animation: spawn .16s ease; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.12)} 100%{transform:scale(1)} }
  @keyframes spawn { 0%{transform:scale(0)} 100%{transform:scale(1)} }

  /* 타일 색상 */
  .t2    { background:#2c3450; color:#e9ecf8; }
  .t4    { background:#37406a; color:#e9ecf8; }
  .t8    { background:#4a6bd6; color:#fff; }
  .t16   { background:#5da9ff; color:#0d0f18; }
  .t32   { background:#4dd0e1; color:#0d0f18; }
  .t64   { background:#4dd07a; color:#0d0f18; }
  .t128  { background:#b388ff; color:#0d0f18; }
  .t256  { background:#ff9f43; color:#0d0f18; }
  .t512  { background:#ff7a45; color:#fff; }
  .t1024 { background:#ff5a4d; color:#fff; }
  .t2048 { background:var(--accent); color:#14131c; box-shadow:0 0 26px rgba(255,204,77,0.6); }
  .tbig  { background:#111; color:var(--accent); border:1px solid var(--accent); }

  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; border-radius: 14px; text-align: center;
    background: rgba(13,15,24,0.82); backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .overlay .big { font-family: var(--mono); font-size: 1.8rem; font-weight: 700; }
  .overlay.win .big { color: #4dd07a; }
  .overlay.lose .big { color: #ff5a4d; }
  .overlay p { color: var(--muted); font-size: 0.9rem; }

  .hint { margin-top: 18px; color: var(--faint); font-size: 0.8rem;
    text-align: center; font-family: var(--mono); }
  @media (max-width: 480px) {
    #board { --size: min(20vw, 96px); --gap: 3.2vw; --pad: 3.2vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; } .tile.pop, .tile.spawn { animation: none; }
  }
</style>
</head>
<body>
  <a class="home-nav" href="index.html">← 게임 모음</a>
  <h1>🧩 <span class="accent">2048</span></h1>
  <div class="subtitle">같은 숫자를 밀어 합쳐 <b>2048</b>을 만드세요</div>

  <div class="topbar">
    <div class="scorebox"><div class="lbl">점수</div><div class="val" id="score">0</div></div>
    <div class="scorebox"><div class="lbl">최고</div><div class="val" id="best">0</div></div>
    <button class="newbtn" id="newBtn">새 게임</button>
  </div>

  <div class="board-wrap">
    <div id="board">
      <div class="overlay" id="overlay">
        <div class="big" id="overlayText"></div>
        <p id="overlaySub"></p>
        <button class="newbtn" id="overlayBtn">다시 하기</button>
      </div>
    </div>
  </div>

  <div class="hint">방향키 / WASD 로 이동 · 모바일은 스와이프 · R 키로 새 게임</div>

<script>
const SIZE = 4;
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const overlaySub = document.getElementById('overlaySub');

let grid, score, best, won, over, idCounter;
let tiles = {};   // id -> element

best = +(localStorage.getItem('mini2048_best') || 0);
bestEl.textContent = best;

// 배경 셀 좌표 계산용
function cellPos(r, c) {
  const cs = getComputedStyle(boardEl);
  const size = parseFloat(cs.getPropertyValue('--size'));
  const gap  = parseFloat(cs.getPropertyValue('--gap'));
  const pad  = parseFloat(cs.getPropertyValue('--pad'));
  return {
    x: pad + c * (size + gap),
    y: pad + r * (size + gap),
  };
}

let bgCells = [];
function buildBackground() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      const bg = document.createElement('div');
      bg.className = 'bg-cell';
      boardEl.appendChild(bg);
      bgCells.push({ r, c, el: bg });
    }
  layoutBackground();
}
function layoutBackground() {
  const cs = getComputedStyle(boardEl);
  const size = parseFloat(cs.getPropertyValue('--size'));
  bgCells.forEach(({ r, c, el }) => {
    const { x, y } = cellPos(r, c);
    el.style.transform = `translate(${x}px, ${y}px)`;
    el.style.width = size + 'px'; el.style.height = size + 'px';
  });
}

function newGame() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  score = 0; won = false; over = false; idCounter = 1;
  Object.values(tiles).forEach(el => el.remove());
  tiles = {};
  scoreEl.textContent = '0';
  overlay.className = 'overlay';
  addRandom(); addRandom();
  render();
}

function addRandom() {
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (!grid[r][c]) empty.push([r, c]);
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  grid[r][c] = { id: idCounter++, val: Math.random() < 0.9 ? 2 : 4, spawn: true };
}

function tileClass(v) {
  if (v <= 2048) return 't' + v;
  return 'tbig';
}

function render() {
  const cs = getComputedStyle(boardEl);
  const size = parseFloat(cs.getPropertyValue('--size'));
  const seen = new Set();

  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      const cell = grid[r][c];
      if (!cell) continue;
      seen.add(cell.id);
      let el = tiles[cell.id];
      const { x, y } = cellPos(r, c);
      if (!el) {
        el = document.createElement('div');
        el.innerHTML = '<span class="v"></span>';
        boardEl.appendChild(el);
        tiles[cell.id] = el;
        el.style.transform = `translate(${x}px, ${y}px)`;
      }
      el.className = 'tile ' + tileClass(cell.val) + (String(cell.val).length >= 4 ? ' small' : '');
      el.querySelector('.v').textContent = cell.val;
      el.style.width = size + 'px'; el.style.height = size + 'px';
      // 위치 이동
      el.style.transform = `translate(${x}px, ${y}px)`;
      if (cell.spawn) { el.classList.add('spawn'); cell.spawn = false; }
      if (cell.merged) { el.classList.add('pop'); cell.merged = false; }
      el.addEventListener('animationend', () => el.classList.remove('pop', 'spawn'), { once: true });
    }

  // 사라진 타일 제거
  for (const id in tiles) {
    if (!seen.has(+id)) { tiles[id].remove(); delete tiles[id]; }
  }

  scoreEl.textContent = score;
  if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('mini2048_best', best); }
}

// 한 줄(왼쪽 방향 기준)을 병합. line: [cell|null]*SIZE -> {line, moved, gained}
function slide(line) {
  const cells = line.filter(Boolean);
  const out = []; let gained = 0; let moved = false;
  for (let i = 0; i < cells.length; i++) {
    if (i + 1 < cells.length && cells[i].val === cells[i + 1].val) {
      const val = cells[i].val * 2;
      out.push({ id: cells[i].id, val, merged: true });
      gained += val;
      if (val === 2048) won = true;
      i++; // 다음 것 소비
    } else {
      out.push(cells[i]);
    }
  }
  while (out.length < SIZE) out.push(null);
  // 이동 여부 판정
  for (let i = 0; i < SIZE; i++) {
    const a = line[i], b = out[i];
    if ((a && b && (a.id !== b.id || a.val !== b.val)) || (!a && b) || (a && !b)) moved = true;
  }
  return { line: out, gained };
}

function move(dir) {
  if (over) return;
  let moved = false; let gained = 0;

  const getLine = (i) => {
    const line = [];
    for (let j = 0; j < SIZE; j++) {
      if (dir === 'left')  line.push(grid[i][j]);
      if (dir === 'right') line.push(grid[i][SIZE - 1 - j]);
      if (dir === 'up')    line.push(grid[j][i]);
      if (dir === 'down')  line.push(grid[SIZE - 1 - j][i]);
    }
    return line;
  };
  const setLine = (i, line) => {
    for (let j = 0; j < SIZE; j++) {
      if (dir === 'left')  grid[i][j] = line[j];
      if (dir === 'right') grid[i][SIZE - 1 - j] = line[j];
      if (dir === 'up')    grid[j][i] = line[j];
      if (dir === 'down')  grid[SIZE - 1 - j][i] = line[j];
    }
  };

  for (let i = 0; i < SIZE; i++) {
    const before = getLine(i);
    const res = slide(before);
    gained += res.gained;
    // 변경 감지
    for (let j = 0; j < SIZE; j++) {
      const a = before[j], b = res.line[j];
      if ((a?.id ?? -1) !== (b?.id ?? -1) || (a?.val ?? -1) !== (b?.val ?? -1)) moved = true;
    }
    setLine(i, res.line);
  }

  if (!moved) return;
  score += gained;
  addRandom();
  render();
  checkEnd();
}

function movesAvailable() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (!grid[r][c]) return true;
      const v = grid[r][c].val;
      if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].val === v) return true;
      if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].val === v) return true;
    }
  return false;
}

function checkEnd() {
  if (won && !over) {
    over = true;
    overlayText.textContent = '🎉 2048 달성!';
    overlaySub.textContent = `점수 ${score} · 계속 이어서 도전할 수도 있어요`;
    overlay.className = 'overlay win show';
    // 승리 후에도 계속하기: 다시하기 버튼 옆 이어하기
    return;
  }
  if (!movesAvailable()) {
    over = true;
    overlayText.textContent = '게임 오버';
    overlaySub.textContent = `더 이상 움직일 수 없어요 · 최종 점수 ${score}`;
    overlay.className = 'overlay lose show';
  }
}

// 승리 오버레이에서 "이어하기" 지원: 오버레이 클릭 시 닫고 계속
overlay.addEventListener('click', (e) => {
  if (e.target === overlay && overlay.classList.contains('win')) {
    overlay.className = 'overlay'; over = false;
  }
});

const KEYMAP = {
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'up', w: 'up', W: 'up',
  ArrowDown: 'down', s: 'down', S: 'down',
};
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') { newGame(); return; }
  const dir = KEYMAP[e.key];
  if (!dir) return;
  e.preventDefault();
  move(dir);
});

// 스와이프
let sx = 0, sy = 0, touching = false;
boardEl.addEventListener('touchstart', (e) => {
  const t = e.touches[0]; sx = t.clientX; sy = t.clientY; touching = true;
}, { passive: true });
boardEl.addEventListener('touchend', (e) => {
  if (!touching) return; touching = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
}, { passive: true });

document.getElementById('newBtn').addEventListener('click', newGame);
document.getElementById('overlayBtn').addEventListener('click', (e) => { e.stopPropagation(); newGame(); });
window.addEventListener('resize', () => { layoutBackground(); render(); });

buildBackground();
newGame();
</script>
</body>
</html>
