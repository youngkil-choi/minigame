<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메모리 카드 — 미니 아케이드</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0d0f18;
    --panel: #161a28;
    --panel-2: #1c2132;
    --cell-line: #313a56;
    --accent: #ffcc4d;
    --match: #4dd07a;
    --card: #b388ff;
    --text: #e9ecf8;
    --muted: #8b93b8;
    --faint: #5b6488;
    --mono: ui-monospace, "Cascadia Code", "Consolas", monospace;
    --sans: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: linear-gradient(160deg, #12141f, #0d0f18);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 16px 40px; user-select: none; -webkit-font-smoothing: antialiased;
  }
  .home-nav {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 0.82rem; color: var(--text); text-decoration: none;
    background: rgba(22,26,40,0.7); border: 1px solid var(--cell-line);
    padding: 9px 15px; border-radius: 10px; backdrop-filter: blur(6px);
    transition: border-color .15s, transform .12s;
  }
  .home-nav:hover { border-color: var(--accent); transform: translateY(-1px); }
  .home-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  h1 { font-family: var(--mono); font-size: 2rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 .accent { color: var(--card); }
  .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }

  .topbar {
    display: flex; align-items: stretch; gap: 10px;
    width: 100%; max-width: 520px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center;
  }
  .scorebox {
    flex: 1; min-width: 84px; background: var(--panel); border: 1px solid var(--cell-line);
    border-radius: 12px; padding: 9px 14px; text-align: center;
  }
  .scorebox .lbl { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint); }
  .scorebox .val { font-family: var(--mono); font-size: 1.3rem; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .pills { display: flex; gap: 6px; }
  .pills button {
    font-family: var(--mono); font-size: 0.76rem;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--cell-line); border-radius: 9px;
    padding: 8px 12px; cursor: pointer; transition: all .15s;
  }
  .pills button.active { background: var(--card); color: #0d0f18; border-color: var(--card); font-weight: 700; }
  .pills button:not(.active):hover { border-color: var(--card); color: var(--text); }
  .newbtn {
    font-family: var(--mono); font-size: 0.82rem; font-weight: 600;
    background: var(--accent); color: #14131c; border: none;
    border-radius: 10px; padding: 0 16px; cursor: pointer;
    transition: transform .12s; box-shadow: 0 6px 18px rgba(255,204,77,0.22);
  }
  .newbtn:hover { transform: translateY(-2px); }

  .board-wrap { position: relative; }
  #board {
    display: grid; gap: 10px;
    background: var(--panel); border: 1px solid var(--cell-line);
    border-radius: 16px; padding: 14px;
  }
  .card {
    aspect-ratio: 1; width: var(--cardsize, 84px);
    position: relative; cursor: pointer;
    perspective: 700px; background: transparent; border: none; padding: 0;
  }
  .card-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d; transition: transform .38s ease;
    border-radius: 12px;
  }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    font-size: clamp(1.6rem, 8vw, 2.4rem);
  }
  .face.back {
    background: linear-gradient(150deg, #2a3150, #1c2132);
    border: 1px solid var(--cell-line);
    color: var(--faint); font-family: var(--mono); font-weight: 700; font-size: 1.2rem;
  }
  .face.front {
    background: linear-gradient(150deg, #232a3e, #171d2e);
    border: 1px solid var(--cell-line);
    transform: rotateY(180deg);
  }
  .card.matched .face.front {
    border-color: var(--match);
    box-shadow: 0 0 18px rgba(77,208,122,0.45) inset, 0 0 12px rgba(77,208,122,0.3);
    animation: matchpop .4s ease;
  }
  @keyframes matchpop { 0%{transform:rotateY(180deg) scale(1)} 45%{transform:rotateY(180deg) scale(1.08)} 100%{transform:rotateY(180deg) scale(1)} }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }

  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; border-radius: 16px; text-align: center;
    background: rgba(13,15,24,0.86); backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; color: var(--match); }
  .overlay p { color: var(--muted); font-size: 0.92rem; }
  .btn {
    font-family: var(--mono); font-size: 0.9rem; font-weight: 600;
    background: var(--accent); color: #14131c; border: none;
    border-radius: 12px; padding: 12px 24px; cursor: pointer;
    transition: transform .12s; box-shadow: 0 6px 20px rgba(255,204,77,0.24);
  }
  .btn:hover { transform: translateY(-2px); }

  .hint { margin-top: 18px; color: var(--faint); font-size: 0.8rem;
    text-align: center; font-family: var(--mono); }
  @media (prefers-reduced-motion: reduce) {
    .card-inner { transition: none; } .card.matched .face.front { animation: none; }
    .newbtn, .btn, .home-nav { transition: none; }
  }
</style>
</head>
<body>
  <a class="home-nav" href="index.html">← 게임 모음</a>
  <h1>🃏 <span class="accent">메모리 카드</span></h1>
  <div class="subtitle">뒤집힌 카드에서 같은 그림 짝을 모두 찾으세요</div>

  <div class="topbar">
    <div class="scorebox"><div class="lbl">이동</div><div class="val" id="moves">0</div></div>
    <div class="scorebox"><div class="lbl">짝</div><div class="val" id="pairs">0/0</div></div>
    <div class="scorebox"><div class="lbl">시간</div><div class="val" id="time">0:00</div></div>
    <div class="pills" id="diffPills">
      <button data-diff="easy" class="active">4×4</button>
      <button data-diff="medium">6×4</button>
      <button data-diff="hard">6×6</button>
    </div>
    <button class="newbtn" id="newBtn">새 게임</button>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
    <div class="overlay hidden" id="overlay">
      <div class="big" id="overlayText">🎉 클리어!</div>
      <p id="overlaySub"></p>
      <button class="btn" id="overlayBtn">다시 하기</button>
    </div>
  </div>

  <div class="hint">카드를 클릭해 뒤집기 · 같은 그림 2장을 찾으면 짝 완성</div>

<script>
const EMOJIS = ['🍎','🍌','🍇','🍒','🍑','🍍','🥝','🍉','🍓','🫐','🥥','🍊','🍋','🥭','🍏','🍈','🥑','🌶️'];
const DIFFS = {
  easy:   { cols: 4, rows: 4 },   // 8쌍
  medium: { cols: 6, rows: 4 },   // 12쌍
  hard:   { cols: 6, rows: 6 },   // 18쌍
};
let diff = 'easy';

const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const timeEl = document.getElementById('time');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const overlaySub = document.getElementById('overlaySub');

let deck, first, second, lock, moves, matched, totalPairs;
let timer = null, seconds = 0, started = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function fmtTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function startTimer() {
  if (timer) return;
  timer = setInterval(() => { seconds++; timeEl.textContent = fmtTime(seconds); }, 1000);
}
function stopTimer() { clearInterval(timer); timer = null; }

function newGame() {
  stopTimer();
  const { cols, rows } = DIFFS[diff];
  totalPairs = (cols * rows) / 2;
  const chosen = shuffle(EMOJIS.slice()).slice(0, totalPairs);
  deck = shuffle(chosen.concat(chosen).map((e, i) => ({ emoji: e, id: i })));
  first = second = null; lock = false; moves = 0; matched = 0;
  seconds = 0; started = false;
  movesEl.textContent = '0';
  pairsEl.textContent = `0/${totalPairs}`;
  timeEl.textContent = '0:00';
  overlay.className = 'overlay hidden';

  // 카드 크기: 화면 폭에 맞춰 조정
  const maxBoard = Math.min(560, window.innerWidth - 40);
  const gap = 10, pad = 14;
  const size = Math.floor((maxBoard - pad * 2 - gap * (cols - 1)) / cols);
  boardEl.style.setProperty('--cardsize', Math.max(46, Math.min(size, 96)) + 'px');
  boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cardsize))`;

  boardEl.innerHTML = '';
  deck.forEach((cardData, idx) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.dataset.idx = idx;
    card.setAttribute('aria-label', '카드');
    card.innerHTML = `
      <div class="card-inner">
        <div class="face back">?</div>
        <div class="face front">${cardData.emoji}</div>
      </div>`;
    card.addEventListener('click', () => flip(card, cardData));
    boardEl.appendChild(card);
  });
}

function flip(card, data) {
  if (lock) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (!started) { started = true; startTimer(); }

  card.classList.add('flipped');

  if (!first) { first = { card, data }; return; }

  second = { card, data };
  moves++; movesEl.textContent = moves;

  if (first.data.emoji === second.data.emoji) {
    // 매칭 성공
    const a = first.card, b = second.card;
    setTimeout(() => { a.classList.add('matched'); b.classList.add('matched'); }, 260);
    matched++;
    pairsEl.textContent = `${matched}/${totalPairs}`;
    first = second = null;
    if (matched === totalPairs) finish();
  } else {
    // 실패 → 잠시 후 다시 뒤집기
    lock = true;
    const a = first.card, b = second.card;
    setTimeout(() => {
      a.classList.remove('flipped'); b.classList.remove('flipped');
      first = second = null; lock = false;
    }, 750);
  }
}

function finish() {
  stopTimer();
  overlayText.textContent = '🎉 클리어!';
  overlaySub.textContent = `${moves}번 이동 · ${fmtTime(seconds)} 소요`;
  overlay.className = 'overlay';
}

document.getElementById('diffPills').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#diffPills button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  diff = b.dataset.diff; newGame();
});
document.getElementById('newBtn').addEventListener('click', newGame);
document.getElementById('overlayBtn').addEventListener('click', newGame);
window.addEventListener('resize', () => {
  const { cols } = DIFFS[diff];
  const maxBoard = Math.min(560, window.innerWidth - 40);
  const size = Math.floor((maxBoard - 28 - 10 * (cols - 1)) / cols);
  boardEl.style.setProperty('--cardsize', Math.max(46, Math.min(size, 96)) + 'px');
});

newGame();
</script>
</body>
</html>
