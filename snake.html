<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스네이크 — 미니 아케이드</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0d0f18;
    --panel: #161a28;
    --cell-line: #313a56;
    --accent: #ffcc4d;
    --snake: #4dd07a;
    --snake-head: #7ee6a0;
    --food: #ff5a4d;
    --text: #e9ecf8;
    --muted: #8b93b8;
    --faint: #5b6488;
    --mono: ui-monospace, "Cascadia Code", "Consolas", monospace;
    --sans: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: linear-gradient(160deg, #12141f, #0d0f18);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 16px 40px; user-select: none; -webkit-font-smoothing: antialiased;
  }
  .home-nav {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 0.82rem; color: var(--text); text-decoration: none;
    background: rgba(22,26,40,0.7); border: 1px solid var(--cell-line);
    padding: 9px 15px; border-radius: 10px; backdrop-filter: blur(6px);
    transition: border-color .15s, transform .12s;
  }
  .home-nav:hover { border-color: var(--accent); transform: translateY(-1px); }
  .home-nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  h1 { font-family: var(--mono); font-size: 2rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 .accent { color: var(--snake); }
  .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }

  .topbar {
    display: flex; align-items: stretch; gap: 10px;
    width: 100%; max-width: 460px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center;
  }
  .scorebox {
    flex: 1; min-width: 90px; background: var(--panel); border: 1px solid var(--cell-line);
    border-radius: 12px; padding: 9px 14px; text-align: center;
  }
  .scorebox .lbl { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint); }
  .scorebox .val { font-family: var(--mono); font-size: 1.35rem; font-weight: 700;
    color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .pills { display: flex; gap: 6px; }
  .pills button {
    font-family: var(--mono); font-size: 0.76rem;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--cell-line); border-radius: 9px;
    padding: 8px 12px; cursor: pointer; transition: all .15s;
  }
  .pills button.active { background: var(--snake); color: #0d0f18; border-color: var(--snake); font-weight: 700; }
  .pills button:not(.active):hover { border-color: var(--snake); color: var(--text); }

  .board-wrap { position: relative; }
  canvas {
    display: block; background: #0a0c14;
    border: 1px solid var(--cell-line); border-radius: 14px;
    box-shadow: inset 0 2px 24px rgba(0,0,0,0.6);
    max-width: 92vw; height: auto; touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; border-radius: 14px; text-align: center;
    background: rgba(13,15,24,0.82); backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-family: var(--mono); font-size: 1.7rem; font-weight: 700; }
  .overlay.lose .big { color: var(--food); }
  .overlay.ready .big { color: var(--snake); }
  .overlay p { color: var(--muted); font-size: 0.9rem; max-width: 32ch; }
  .btn {
    font-family: var(--mono); font-size: 0.9rem; font-weight: 600;
    background: var(--accent); color: #14131c; border: none;
    border-radius: 12px; padding: 12px 24px; cursor: pointer;
    transition: transform .12s, box-shadow .2s; box-shadow: 0 6px 20px rgba(255,204,77,0.24);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,204,77,0.38); }

  .hint { margin-top: 18px; color: var(--faint); font-size: 0.8rem;
    text-align: center; font-family: var(--mono); }
  .dpad { display: none; margin-top: 18px; grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px); gap: 8px; }
  .dpad button {
    background: var(--panel); border: 1px solid var(--cell-line); color: var(--text);
    border-radius: 12px; font-size: 1.3rem; cursor: pointer;
  }
  .dpad button:active { background: var(--snake); color: #0d0f18; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) { .dpad { display: grid; } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <a class="home-nav" href="index.html">← 게임 모음</a>
  <h1>🐍 <span class="accent">스네이크</span></h1>
  <div class="subtitle">먹이를 먹고 자라나되, 벽과 자기 몸은 피하세요</div>

  <div class="topbar">
    <div class="scorebox"><div class="lbl">점수</div><div class="val" id="score">0</div></div>
    <div class="scorebox"><div class="lbl">최고</div><div class="val" id="best">0</div></div>
    <div class="pills" id="speedPills">
      <button data-speed="slow">느림</button>
      <button data-speed="normal" class="active">보통</button>
      <button data-speed="fast">빠름</button>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay ready" id="overlay">
      <div class="big" id="overlayText">시작 준비</div>
      <p id="overlaySub">방향키 또는 WASD를 누르면 시작합니다.</p>
      <button class="btn" id="overlayBtn">게임 시작</button>
    </div>
  </div>

  <div class="hint">방향키 / WASD 이동 · Space 일시정지 · R 새 게임</div>
  <div class="dpad" id="dpad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;              // 20x20 셀
const CELL = canvas.width / GRID;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const overlaySub = document.getElementById('overlaySub');

const SPEEDS = { slow: 160, normal: 110, fast: 70 };
let speedKey = 'normal';
let tickMs = SPEEDS[speedKey];

let snake, dir, nextDir, food, score, best, alive, started, paused;
let lastTime = 0, acc = 0, rafId = null;

best = +(localStorage.getItem('miniSnake_best') || 0);
bestEl.textContent = best;

function reset() {
  snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0; alive = true; started = false; paused = false;
  scoreEl.textContent = '0';
  placeFood();
  showOverlay('ready', '시작 준비', '방향키 또는 WASD를 누르면 시작합니다.', '게임 시작');
  draw();
}

function placeFood() {
  while (true) {
    const f = { x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0 };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}

function showOverlay(cls, title, sub, btn) {
  overlay.className = 'overlay ' + cls;
  overlayText.textContent = title;
  overlaySub.textContent = sub;
  document.getElementById('overlayBtn').textContent = btn;
}
function hideOverlay() { overlay.className = 'overlay hidden'; }

function startGame() {
  if (started && alive) return;
  if (!alive) reset();
  started = true; paused = false;
  hideOverlay();
  lastTime = 0; acc = 0;
  if (!rafId) rafId = requestAnimationFrame(loop);
}

function loop(t) {
  rafId = requestAnimationFrame(loop);
  if (!started || paused || !alive) { lastTime = t; return; }
  if (!lastTime) lastTime = t;
  acc += t - lastTime; lastTime = t;
  while (acc >= tickMs) { step(); acc -= tickMs; }
  draw();
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 벽 충돌
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return die();
  // 자기 몸 충돌 (꼬리는 이번 턴에 비켜나므로 마지막 칸 제외 검사)
  const willGrow = (head.x === food.x && head.y === food.y);
  const body = willGrow ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);
  if (willGrow) {
    score += 10; scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('miniSnake_best', best); }
    placeFood();
  } else {
    snake.pop();
  }
}

function die() {
  alive = false;
  showOverlay('lose', '게임 오버', `길이 ${snake.length} · 점수 ${score}`, '다시 하기');
  overlay.classList.remove('hidden');
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 격자
  ctx.strokeStyle = 'rgba(49,58,86,0.25)';
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
  }
  // 먹이
  const fx = food.x * CELL, fy = food.y * CELL;
  ctx.fillStyle = '#ff5a4d';
  ctx.shadowColor = '#ff5a4d'; ctx.shadowBlur = 14;
  roundRect(fx + CELL * 0.18, fy + CELL * 0.18, CELL * 0.64, CELL * 0.64, 5); ctx.fill();
  ctx.shadowBlur = 0;
  // 뱀
  snake.forEach((s, i) => {
    const x = s.x * CELL, y = s.y * CELL;
    if (i === 0) {
      ctx.fillStyle = '#7ee6a0';
      ctx.shadowColor = '#4dd07a'; ctx.shadowBlur = 12;
    } else {
      const t = i / snake.length;
      ctx.fillStyle = `rgb(${77 - t * 30}, ${208 - t * 90}, ${122 - t * 40})`;
      ctx.shadowBlur = 0;
    }
    roundRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3, 6); ctx.fill();
  });
  ctx.shadowBlur = 0;
}

function setDir(d) {
  if (!started && alive) startGame();
  const map = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };
  const nd = map[d];
  if (!nd) return;
  // 180도 반대 방향 금지
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}

const KEYMAP = {
  ArrowUp: 'up', w: 'up', W: 'up',
  ArrowDown: 'down', s: 'down', S: 'down',
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
};
window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') { cancelAnimationFrame(rafId); rafId = null; reset(); startGame(); return; }
  if (e.key === ' ') {
    e.preventDefault();
    if (started && alive) {
      paused = !paused;
      if (paused) { overlay.className = 'overlay ready'; overlayText.textContent = '일시정지'; overlaySub.textContent = 'Space를 다시 눌러 계속하세요.'; document.getElementById('overlayBtn').textContent = '계속하기'; }
      else hideOverlay();
    }
    return;
  }
  const d = KEYMAP[e.key];
  if (d) { e.preventDefault(); setDir(d); }
});

// D-pad
document.getElementById('dpad').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (b) setDir(b.dataset.dir);
});

// 스와이프
let sx = 0, sy = 0, touching = false;
canvas.addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; touching = true; }, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (!touching) return; touching = false;
  const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
  else setDir(dy > 0 ? 'down' : 'up');
}, { passive: true });

// 속도 선택
document.getElementById('speedPills').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#speedPills button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  speedKey = b.dataset.speed; tickMs = SPEEDS[speedKey];
});

document.getElementById('overlayBtn').addEventListener('click', startGame);

reset();
rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
